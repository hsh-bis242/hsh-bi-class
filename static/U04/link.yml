version: 2

sources:
  - name: willibald_dwh_links
    schema: dwh_sl
    tables:
    
      - name: lnk_bestellung_kreditkarte
        columns:
          - name: bestellung_sk
            tests:
              - not_null
              - relationships:
                  to: source('willibald_dwh_hubs', 'hub_bestellung')
                  field: bestellung_sk
          - name: kreditkarte_sk
            tests:
            # Dieser unique test failed. Warum ist dieser aus fachlicher Sicht falsch?
            # Antwort:
              - unique
              - not_null
              - relationships:
                  to: source('willibald_dwh_hubs', 'hub_kreditkarte')
                  field: kreditkarte_sk
          - name: audit_trail_id
            tests:
              - accepted_values: 
                  values: [-1]
        # Hier wird auf die eindeutige Kombination zweier Spalten getestet. Dafür muss das Package dbt-labs/dbt_utils über eine packages.yml geleaden werden.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - bestellung_sk
                - kreditkarte_sk


      - name: lnk_bestellung_kunde
        columns:
          - name: bestellung_sk
            tests:
              - not_null
              - relationships:
                  to: source('willibald_dwh_hubs', 'hub_bestellung')
                  field: bestellung_sk
          - name: kunde_sk
            tests:
              - not_null
              - relationships:
                  to: source('willibald_dwh_hubs', 'hub_kunde')
                  field: kunde_sk
          - name: audit_trail_id
            tests:
              - accepted_values: 
                  values: [-1]
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - bestellung_sk
                - kunde_sk