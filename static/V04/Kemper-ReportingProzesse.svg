    xmlns="http://www.w3.org/2000/svg" width="100%" id="mermaid-svg">
    <style>
    #mermaid-svg {
        font-family: "trebuchet ms", verdana, arial, sans-serif;
        font-size: 16px;
        fill: #333;
    }

    #mermaid-svg .error-icon {
        fill: #552222;
    }

    #mermaid-svg .error-text {
        fill: #552222;
        stroke: #552222;
    }

    #mermaid-svg .edge-thickness-normal {
        stroke-width: 2px;
    }

    #mermaid-svg .edge-thickness-thick {
        stroke-width: 3.5px;
    }

    #mermaid-svg .edge-pattern-solid {
        stroke-dasharray: 0;
    }

    #mermaid-svg .edge-pattern-dashed {
        stroke-dasharray: 3;
    }

    #mermaid-svg .edge-pattern-dotted {
        stroke-dasharray: 2;
    }

    #mermaid-svg .marker {
        fill: #333333;
        stroke: #333333;
    }

    #mermaid-svg .marker.cross {
        stroke: #333333;
    }

    #mermaid-svg svg {
        font-family: "trebuchet ms", verdana, arial, sans-serif;
        font-size: 16px;
    }

    #mermaid-svg .label {
        font-family: "trebuchet ms", verdana, arial, sans-serif;
        color: #333;
    }

    #mermaid-svg .cluster-label text {
        fill: #333;
    }

    #mermaid-svg .cluster-label span {
        color: #333;
    }

    #mermaid-svg .label text,
    #mermaid-svg span {
        fill: #333;
        color: #333;
    }

    #mermaid-svg .node rect,
    #mermaid-svg .node circle,
    #mermaid-svg .node ellipse,
    #mermaid-svg .node polygon,
    #mermaid-svg .node path {
        fill: #dc3b055d;
        stroke: #dc3c05;
        stroke-width: 1px;
    }

    #mermaid-svg .node .label {
        text-align: center;
    }

    #mermaid-svg .node.clickable {
        cursor: pointer;
    }

    #mermaid-svg .arrowheadPath {
        fill: #333333;
    }

    #mermaid-svg .edgePath .path {
        stroke: #333333;
        stroke-width: 2.0px;
    }

    #mermaid-svg .flowchart-link {
        stroke: #333333;
        fill: none;
    }

    #mermaid-svg .edgeLabel {
        background-color: #e8e8e8;
        text-align: center;
    }

    #mermaid-svg .edgeLabel rect {
        opacity: 0.5;
        background-color: #e8e8e8;
        fill: #e8e8e8;
    }

    #mermaid-svg .cluster rect {
        fill: #ffffde;
        stroke: #aaaa33;
        stroke-width: 1px;
    }

    #mermaid-svg .cluster text {
        fill: #333;
    }

    #mermaid-svg .cluster span {
        color: #333;
    }

    #mermaid-svg div.mermaidTooltip {
        position: absolute;
        text-align: center;
        max-width: 200px;
        padding: 2px;
        font-family: "trebuchet ms", verdana, arial, sans-serif;
        font-size: 12px;
        background: hsl(80, 100%, 96.2745098039%);
        border: 1px solid #aaaa33;
        border-radius: 2px;
        pointer-events: none;
        z-index: 100;
    }

    #mermaid-svg .flowchartTitleText {
        text-anchor: middle;
        font-size: 18px;
        fill: #333;
    }

    #mermaid-svg :root {
        --mermaid-font-family: "trebuchet ms", verdana, arial, sans-serif;
    }
    </style>
