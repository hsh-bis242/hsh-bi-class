name: Gruppen-Beitritt verarbeiten

# Self-Service Team-Beitritt (Ersatz für GitHub Classroom):
# Ein Issue-Formular liefert HSH-E-Mail + Gruppennummer. Diese Action
# 1) validiert das Format beider Angaben,
# 2) prüft die Teamgröße (max. 3 Mitglieder),
# 3) fügt den *authentifizierten* Issue-Ersteller (nicht frei eingebbar!)
#    zum GitHub-Team der Gruppe hinzu,
# 4) trägt Gruppe + GitHub-Name in die CSV ein (Commit, nur zur Doku),
# 5) kommentiert das Ergebnis und schließt das Issue bei Erfolg.
#
# Sicherheits-Hinweise:
# - Der GitHub-Benutzername wird NIE aus dem Issue-Text übernommen,
#   sondern ausschließlich aus `github.event.issue.user.login` gelesen.
#   Das verhindert, dass jemand im Namen eines anderen Accounts Zugriff
#   anfordert.
# - Gruppennummer und E-Mail werden vor jeder Verwendung per Regex
#   validiert, bevor sie in API-Aufrufe oder Dateipfade einfließen.
# - secrets.ORG_ADMIN_TOKEN (PAT mit `admin:org`) wird NUR im Schritt
#   "Team-Mitgliedschaft setzen" für die Team-API verwendet. Dieser Schritt
#   darf selbst keine Issue-Kommentare/Labels schreiben, da das Token dafür
#   keine Repo-Rechte hat. Alle Issue-Interaktionen (Kommentare, Labels,
#   Schließen) laufen über das Standard-GITHUB_TOKEN (contents/issues: write
#   reichen dafür aus).

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write

env:
  ORG: hsh-bis242
  PREFIX: bis-242-ws26
  CSV_PATH: gruppen/ws26_github.csv
  MAX_MEMBERS_PER_GROUP: 3

jobs:
  gruppen-beitritt:
    if: contains(github.event.issue.labels.*.name, 'gruppen-beitritt')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Eingaben parsen und validieren
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            const emailMatch = body.match(/### HSH-E-Mail-Adresse\s*\n+\s*([^\n#]+)/i);
            const gruppeMatch = body.match(/### Übungsgruppe\s*\n+\s*([^\n#]+)/i);

            const email = (emailMatch ? emailMatch[1] : "").trim().toLowerCase();
            const gruppe = (gruppeMatch ? gruppeMatch[1] : "").trim();

            const emailOk = /^[a-z0-9._-]+@stud\.hs-hannover\.de$/.test(email);
            const gruppeOk = /^(0[1-9]|10)$/.test(gruppe);

            if (!emailOk || !gruppeOk) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  "❌ Dein Antrag konnte nicht automatisch verarbeitet werden.",
                  "",
                  !emailOk ? "- Die HSH-E-Mail-Adresse ist ungültig oder fehlt (muss auf `@stud.hs-hannover.de` enden)." : "",
                  !gruppeOk ? "- Die Gruppennummer ist ungültig (muss 01-10 sein)." : "",
                  "",
                  "Bitte korrigiere dein Issue oder wende dich an den Dozenten.",
                ].filter(Boolean).join("\n"),
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["braucht-dozent"],
              });
              return;
            }

            core.setOutput("email", email);
            core.setOutput("gruppe", gruppe);

      - name: Team-Mitgliedschaft setzen
        id: team
        if: steps.parse.outputs.gruppe
        uses: actions/github-script@v7
        env:
          GRUPPE: ${{ steps.parse.outputs.gruppe }}
        with:
          # Nur dieser Schritt nutzt ORG_ADMIN_TOKEN (admin:org), da er als
          # einziger die Team-API braucht. Er darf selbst KEINE Issue-Kommentare
          # schreiben, da das Token dafür keine Repo-Rechte hat (404). Das
          # Ergebnis wird stattdessen als Output an den nächsten Schritt
          # (Standard-GITHUB_TOKEN) weitergereicht.
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const org = process.env.ORG;
            const prefix = process.env.PREFIX;
            const gruppe = process.env.GRUPPE;
            const maxMembers = parseInt(process.env.MAX_MEMBERS_PER_GROUP, 10);
            const team = `${prefix}-gruppe${gruppe}`;
            const username = context.payload.issue.user.login;

            let members = [];
            try {
              members = await github.paginate(github.rest.teams.listMembersInOrg, {
                org, team_slug: team, per_page: 100,
              });
            } catch (err) {
              core.setOutput("beitritt_status", "no-team");
              core.setOutput("username", username);
              return;
            }

            const alreadyMember = members.some(m => m.login.toLowerCase() === username.toLowerCase());
            if (!alreadyMember && members.length >= maxMembers) {
              core.setOutput("beitritt_status", "full");
              core.setOutput("username", username);
              return;
            }

            const { data: membership } = await github.rest.teams.addOrUpdateMembershipForUserInOrg({
              org, team_slug: team, username, role: "member",
            });

            // state "pending": Person ist noch nicht Org-Mitglied und muss die
            // Einladung zur Organisation erst annehmen.
            core.setOutput("membership_state", membership.state);
            core.setOutput("beitritt_status", "added");
            core.setOutput("username", username);

      - name: Rückmeldung geben
        if: steps.team.outputs.beitritt_status
        uses: actions/github-script@v7
        env:
          GRUPPE: ${{ steps.parse.outputs.gruppe }}
          RESULT: ${{ steps.team.outputs.beitritt_status }}
          USERNAME: ${{ steps.team.outputs.username }}
          MEMBERSHIP_STATE: ${{ steps.team.outputs.membership_state }}
        with:
          script: |
            const org = process.env.ORG;
            const prefix = process.env.PREFIX;
            const gruppe = process.env.GRUPPE;
            const result = process.env.RESULT;
            const username = process.env.USERNAME;
            const team = `${prefix}-gruppe${gruppe}`;

            if (result === "no-team") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ Team \`${team}\` wurde noch nicht angelegt. Bitte wende dich an den Dozenten.`,
              });
              return;
            }

            if (result === "full") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ @${username} Gruppe ${gruppe} hat bereits ${process.env.MAX_MEMBERS_PER_GROUP} Mitglieder. Bitte wähle in Moodle eine andere Gruppe oder wende dich an den Dozenten.`,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["braucht-dozent"],
              });
              return;
            }

            const repo = `${prefix}-gruppe${gruppe}`;
            const pending = process.env.MEMBERSHIP_STATE === "pending";
            const body = pending
              ? `⚠️ @${username} wurde für **Gruppe ${gruppe}** vorgemerkt, hat aber **noch keinen Zugriff**.\n\n**Du musst zuerst die Einladung zur Organisation ${org} annehmen:**\n1. Öffne https://github.com/${org} (oder die Einladungs-E-Mail von GitHub) und klicke auf **Join ${org}**.\n2. Danach hast du automatisch Zugriff auf https://github.com/${org}/${repo}.\n\nDas Issue bleibt zur Kontrolle offen und wird vom Dozenten geschlossen.`
              : `✅ @${username} wurde zu **Gruppe ${gruppe}** hinzugefügt.\n\nRepository: https://github.com/${org}/${repo}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            if (pending) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["einladung-ausstehend"],
              });
            }

      - name: Teilnehmerliste aktualisieren (CSV)
        if: steps.team.outputs.beitritt_status == 'added'
        run: |
          set -euo pipefail
          EMAIL="${{ steps.parse.outputs.email }}"
          GRUPPE="${{ steps.parse.outputs.gruppe }}"
          GITHUB_USER="${{ steps.team.outputs.username }}"

          if [[ ! -f "$CSV_PATH" ]]; then
            echo "gruppe,name,email,github_username" > "$CSV_PATH"
          fi

          awk -F',' -v OFS=',' -v email="$EMAIL" -v gruppe="$GRUPPE" -v user="$GITHUB_USER" '
            NR==1 { print; next }
            {
              e=$3; gsub(/^ +| +$/, "", e)
              if (tolower(e) == email) { $1=gruppe; $4=user; found=1 }
              print
            }
            END { if (!found) print gruppe ",," email "," user }
          ' "$CSV_PATH" > "${CSV_PATH}.tmp" && mv "${CSV_PATH}.tmp" "$CSV_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CSV_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "chore(gruppen): ${GITHUB_USER} zu Gruppe ${GRUPPE} hinzugefügt (Issue #${{ github.event.issue.number }})"
            git push
          fi

      - name: Issue schließen
        if: steps.team.outputs.beitritt_status == 'added' && steps.team.outputs.membership_state != 'pending'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });
