name: Push Slides to Strato Webspace

on:
  push:
    branches:
      - main  # Set a branch to deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: deploy
    steps:
        - name: Checkout
          uses: actions/checkout@v3
        - name: Use Node.js 18
          uses: actions/setup-node@v3
          with:
            node-version: 18
        - run: npm install
        - run: npm run build --if-present
        - name: deploy file
          uses: wlixcc/SFTP-Deploy-Action@v1.2.4
          with:
              username: "sftp_user@bis-242.doerffler.com"
              server: "ssh.strato.de"
              port: 22
              remote_path: '/'
              sftp_only: true
              password: ${{ secrets.ftp_password }}
